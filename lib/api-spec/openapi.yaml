openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /group-media/upload:
    post:
      operationId: uploadGroupMedia
      tags: [groupMedia]
      security:
        - SupabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMediaInput"
      responses:
        "200":
          description: Private file uploaded and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMediaUploadResult"
  /group-media/download:
    post:
      operationId: downloadGroupMedia
      tags: [groupMedia]
      security:
        - SupabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMediaDownloadInput"
      responses:
        "200":
          description: File bytes after a fresh membership check; never a shareable URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMediaFile"
  /account/export:
    get:
      operationId: exportAccountData
      tags: [account]
      security:
        - SupabaseBearer: []
      parameters:
        - in: query
          name: expectedUserId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private account records with temporary download links for owned files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          description: Sign-in required
        "409":
          description: Account changed
        "503":
          description: Export unavailable
  /account/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      security:
        - SupabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "202":
          description: Confirmed self-deletion is queued durably
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [requested]
        "400":
          description: Confirmation missing
        "401":
          description: Sign-in required
        "403":
          description: Recent sign-in required
        "409":
          description: Account changed
        "503":
          description: Deletion service unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /community-access:
    get:
      operationId: getCommunityAccess
      tags: [community]
      summary: Verify personal or community subscription access
      security:
        - SupabaseBearer: []
      parameters:
        - in: query
          name: entitlement
          required: false
          schema:
            type: string
            enum: [premium, premium_community]
            default: premium_community
        - in: query
          name: communityId
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-verified subscription state
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                required: [active]
        "401":
          description: Sign-in required
        "403":
          description: Community membership required
        "503":
          description: Verification temporarily unavailable
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GroupMediaInput:
      type: object
      required: [expectedUserId, groupId, mediaId, kind, mime, base64]
      properties:
        expectedUserId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        mediaId: { type: string, format: uuid }
        kind: { type: string, enum: [image, voice, cover] }
        mime: { type: string }
        base64: { type: string, maxLength: 11184812 }
        durationMs: { type: integer, minimum: 1, maximum: 300000 }
    GroupMediaDownloadInput:
      type: object
      required: [expectedUserId, groupId, mediaId]
      properties:
        expectedUserId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        mediaId: { type: string, format: uuid }
    GroupMediaUploadResult:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    GroupMediaFile:
      type: object
      required: [base64, mime]
      properties:
        base64: { type: string }
        mime: { type: string }
    AccountDeletionInput:
      type: object
      required: [expectedUserId, confirmation]
      properties:
        expectedUserId:
          type: string
          format: uuid
        confirmation:
          type: string
          enum: [DELETE]
    AccountExport:
      type: object
      required: [version, userId, exportedAt, data]
      properties:
        version:
          type: integer
        userId:
          type: string
        exportedAt:
          type: string
        data:
          type: object
          additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

